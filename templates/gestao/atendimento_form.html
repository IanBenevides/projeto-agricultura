{% extends 'base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-sm border border-gray-100 mt-6 animate-fade-in">
    <div class="mb-8 border-b border-gray-100 pb-4">
        <h2 class="text-2xl font-display font-bold text-gray-900 tracking-tight">Registrar Atendimento</h2>
        <p class="text-sm text-gray-500 mt-1">Insira as horas e dados do operador para concluir a solicitação.</p>
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="space-y-6">
            {% for field in form %}
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <p class="text-brand-red text-sm mt-1.5 font-medium flex items-center gap-1"><i class="bi bi-exclamation-circle"></i> {{ field.errors.0 }}</p>
                {% endif %}
            </div>
            {% endfor %}
        </div>
        <div class="mt-8 flex justify-end gap-3 pt-6 border-t border-gray-100">
            <a href="{% url 'solicitacao_list' %}" class="px-6 py-2.5 rounded-full text-gray-700 font-semibold hover:bg-gray-100 transition-colors">Cancelar</a>
            <button type="submit" class="bg-green-600 text-white px-8 py-2.5 rounded-full shadow-md hover:bg-green-700 transition-colors duration-300 font-semibold flex items-center gap-2">
                <i class="bi bi-check-all"></i> Registrar Baixa
            </button>
        </div>
    </form>
</div>
{% endblock %}
