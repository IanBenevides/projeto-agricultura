{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrulha Agrícola - Portal Piraí</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <!-- Tailwind CSS (via script for dynamic configuration without build step) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['ui-sans-serif', 'system-ui', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            blue: '#0d6efd',
                            dark: '#0a58ca',
                            red: '#fd0e6f',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col transition-colors duration-300">
    {% include 'components/navbar.html' %}
    
    <main class="flex-grow w-full max-w-7xl mx-auto py-10 px-4 sm:px-6 lg:px-8">
        {% block content %}{% endblock %}
    </main>
    
    <footer class="bg-gray-900 text-white py-8 mt-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-6 md:gap-8">
            <p class="font-display font-medium text-sm text-center md:text-left text-gray-300">&copy; 2026 Prefeitura Municipal de Piraí. Todos os direitos reservados.</p>
            <div class="flex items-center justify-center gap-8">
                <img src="{% static 'image/inovailogo-removebg-preview.png' %}" alt="Inovaí" class="h-8 object-contain opacity-90 hover:opacity-100 transition-opacity" style="filter: brightness(0) invert(1);">
                <img src="{% static 'image/logosmcti-removebg-preview.png' %}" alt="SMCTI" class="h-8 object-contain opacity-90 hover:opacity-100 transition-opacity" style="filter: brightness(0) invert(1);">
            </div>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
